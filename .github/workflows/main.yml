name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        kube-version:
          - version: "1.34"
            go: "1.24"
          - version: "1.35"
            go: "1.25"
        arch:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm64
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.arch.platform }}
          pull: true
          push: true
          provenance: false
          build-args: |
            KUBE_VERSION=${{ matrix.kube-version.version }}
            KUBE_VERSION_GO=${{ matrix.kube-version.go }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version.version }}-${{ github.sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=${{ matrix.kube-version.version }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kube-version.version }}-${{ matrix.arch.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        kube-version: ["1.34", "1.35"]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, matrix.kube-version) || '' }}
          sources: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}-arm64

name: Build and Publish Patched Kubernetes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    uses: ./.github/workflows/_setup.yml

  build:
    needs: setup
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch.suffix }}
          pull: true
          push: true
          provenance: false
          build-args: |
            KUBE_VERSION=${{ matrix.kube-version.version }}
            KUBE_VERSION_GO=${{ matrix.kube-version.go }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version.version }}-${{ github.sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=${{ matrix.kube-version.version }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kube-version.version }}-${{ matrix.arch.suffix }}

  manifest:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        kube-version: ${{ fromJSON(needs.setup.outputs.versions) }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, matrix.kube-version) || '' }}
          sources: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.kube-version }}-${{ github.sha }}-arm64
